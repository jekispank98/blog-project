[package]
name = "blog-server"
version = "0.1.0"
edition = "2021"

[dependencies]
tonic = "0.14"
tokio = { version = "1", features = ["full"] }
prost = "0.14.2"
actix-web = "4"
actix-web-httpauth ="0.8"
actix-cors = "0.7"
serde_json = "1.0.148"
env_logger = "0.11.8"
serde = { version = "1", features = ["derive"] }
chrono = "0.4.42"
thiserror = "2"
sqlx = { version = "0.7", features = [
    "runtime-tokio-rustls",
    "postgres",
    "uuid",
    "chrono",
    "migrate",
] }
dotenvy = "0.15.7"
jsonwebtoken = { version = "10.2", features = ["rust_crypto"] }
argon2 = "0.5"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
env = "1.0.1"
[build-dependencies]
tonic-build = "0.14.2"
tonic-prost-build = "0.14.2"
prost-build = "0.14.2"
