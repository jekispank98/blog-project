[package]
name = "blog-server"
version = "0.1.0"
edition = "2021"

[dependencies]
tonic = "0.12"
tokio = { version = "1", features = ["full"] }
prost = "0.14"
actix-web = "4"
actix-web-httpauth ="0.8"
actix-cors = "0.7"
serde_json = "1.0.148"
env_logger = "0.11.8"
serde = { version = "1", features = ["derive"] }
chrono = "0.4.42"
thiserror = "2"
sqlx = { version = "0.7", features = [
    "runtime-tokio-rustls",
    "postgres",
    "uuid",
    "chrono",
    "migrate",
] }
dotenvy = "0.15.7"
jsonwebtoken = "10.2"
argon2 = "0.5"
tracing = "0.1"
tracing-subscriber = "0.3"
env = "1.0.1"
[build-dependencies]
tonic-build = "0.12"
