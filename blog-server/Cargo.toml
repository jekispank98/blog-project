[package]
name = "blog-server"
version = "0.1.0"
edition = "2021"

[dependencies]
tonic = "0.12"
tokio = { version = "1", features = ["full"] }
prost = "0.14"
actix-web = "4"
serde_json = "1.0.148"
env_logger = "0.11.8"
serde = { version = "1", features = ["derive"] }

[build-dependencies]
tonic-build = "0.12"

