[package]
name = "blog-wasm"
version = "0.1.0"
edition = "2021"

[lib]
crate-type = ["cdylib", "rlib"]

[dependencies]
wasm-bindgen = "0.2"
wasm-bindgen-futures = "0.4"
web-sys = { version = "0.3", features = ["Document", "Element", "HtmlElement", "Window", "Request", "RequestInit", "Response", "Headers", "console", "Storage", "HtmlFormElement", "HtmlInputElement"] }
gloo-net = "0.6"
serde = { version = "1.0", features = ["derive"] }
serde-wasm-bindgen = "0.6"
serde_json = "1.0"
js-sys = "0.3"
thiserror = { workspace = true }
