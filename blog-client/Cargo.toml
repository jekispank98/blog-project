[package]
name = "blog-client"
version = "0.1.0"
edition = "2021"

[lib]
name = "blog_client"
path = "src/lib.rs"

[dependencies]
tonic = "0.12"
prost = "0.13"
reqwest = { version = "0.12", features = ["json"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
chrono = "0.4"
anyhow = "1"
thiserror = { workspace = true }
async-trait = "0.1"
http = "1"

[build-dependencies]
tonic-build = "0.12"
